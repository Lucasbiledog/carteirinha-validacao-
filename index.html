<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autenticidade da Carteirinha de Estudante</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:linear-gradient(135deg,#7d3cff,#3fa9f5,#ffc247);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px}
.card{background:#fff;width:700px;max-width:100%;border-radius:18px;padding:45px;box-shadow:0 15px 40px rgba(0,0,0,.2)}
h1{font-size:42px;margin-bottom:50px;color:#111}
.logo{text-align:center;margin-bottom:60px}
.logo img{width:180px;max-width:100%}
.info{font-size:24px;margin:25px 0;line-height:1.5}
strong{color:#111}
a{color:#5d2cff;text-decoration:underline;font-weight:bold}
.token{word-break:break-word;font-weight:bold;line-height:1.6;margin-top:10px}
@media(max-width:600px){h1{font-size:30px}.info{font-size:20px}.card{padding:25px}}
</style>
</head>
<body>
<div class="card">
<h1>Autenticidade da Carteirinha de Estudante</h1>
<div class="logo"><img src="logo.png" alt="Logo da Instituição"></div>
<div class="info">Aluno(a): <strong>LUCAS DE MOURA SILVA MENDES</strong></div>
<div class="info">Matrícula: <a href="#">2025100347</a></div>
<div class="info">Curso: <strong>ENGENHARIA DE COMPUTAÇÃO</strong></div>
<div class="info">Unidade: <strong>Unidade Rio Comprido</strong></div>
<div class="info">Chave de autenticidade:
<div class="token">eyJtYXRyaWN1bGEiOiIyMDI1MTAwMzQ3IiwidHlwZSI6Ik...</div>
</div>
</div>
</body>
</html>
